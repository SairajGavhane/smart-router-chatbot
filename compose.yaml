services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jev-smart-router:local
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - type: bind
        source: ./.streamlit/secrets.toml
        target: /app/.streamlit/secrets.toml
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
